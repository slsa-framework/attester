name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Build and publish the release with goreleaser. This job holds all of the
  # build steps; the provenance is generated by a separate, dedicated job so
  # nothing that runs here shares the attester's runner or signing identity.
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # create the release and upload binaries and the SBOM

    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set tag output
        id: tag
        run: echo "tag_name=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        id: goreleaser
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM
        id: sbom
        uses: carabiner-dev/actions/unpack/sbom@32587e82f960d49b36101e8c45d1956e511965d3 # v1.2.9
        with:
          push-to-release: ${{ steps.tag.outputs.tag_name }}
          # goreleaser's proxy mode leaves a synthesized Go module under
          # dist/, which unpack would otherwise discover as a second
          # codebase and SBOM.
          ignore: dist
        env:
          GH_TOKEN: ${{ github.token }}

  # Attest the release with the attester itself (dogfooding): the reusable
  # workflow gives the attester a dedicated job and signs the provenance with
  # the slsa-framework/actions identity. goreleaser publishes straight to the
  # release, so the run's workflow artifact store is empty and the subjects
  # come from the release assets. Only the release job is watched: the
  # publish job below depends on this one, so watching it would deadlock.
  provenance:
    needs: release
    permissions:
      id-token: write # sigstore keyless signing
      actions: read   # read the run's jobs
      contents: read
    uses: slsa-framework/actions/.github/workflows/attest_actions.yml@main
    with:
      watch-jobs: release
      collect-artifacts: false
      release: ${{ needs.release.outputs.tag_name }}

  # Publish the provenance to the release. The installer action verifies the
  # downloaded binaries against this file, so it must land on the release as
  # attestations.jsonl.
  publish:
    needs: [release, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the attestation to the release
    steps:
      - name: Download the attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: slsa-attestations

      - name: Publish provenance to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
        run: |
          mv provenance.intoto.json attestations.jsonl
          gh release upload "${TAG_NAME}" attestations.jsonl
